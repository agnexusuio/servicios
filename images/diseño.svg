<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="150" fill="url(#grad)"/>
  
  <!-- Plano/Blueprint mejorado -->
  <rect x="45" y="20" width="160" height="110" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Marco interior -->
  <rect x="55" y="30" width="140" height="90" rx="2" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.8"/>
  
  <!-- Grid de líneas horizontales -->
  <line x1="60" y1="45" x2="190" y2="45" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="60" x2="190" y2="60" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="75" x2="190" y2="75" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="90" x2="190" y2="90" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="105" x2="190" y2="105" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  
  <!-- Elementos de diseño -->
  <!-- Rectángulo (servidor/componente) -->
  <rect x="70" y="38" width="25" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <rect x="72" y="40" width="21" height="14" fill="#34d399" opacity="0.6"/>
  
  <!-- Círculo (base de datos) -->
  <circle cx="130" cy="48" r="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="130" cy="48" r="8" fill="#ffffff" opacity="0.4"/>
  
  <!-- Líneas de conexión -->
  <line x1="95" y1="47" x2="118" y2="48" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Triángulo (flujo) -->
  <polygon points="165,38 175,48 165,58" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <polygon points="165,38 175,48 165,58" fill="#ffffff" opacity="0.3"/>
  
  <!-- Iconos laterales -->
  <text x="35" y="80" font-size="26" text-anchor="middle" fill="#ffffff">📊</text>
  <text x="265" y="80" font-size="26" text-anchor="middle" fill="#ffffff">✓</text>
</svg>