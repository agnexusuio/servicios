<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="600" height="500" fill="#f8fafc"/>
  
  <!-- Decoración superior -->
  <rect x="50" y="30" width="500" height="80" rx="10" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Servidor/Rack central -->
  <rect x="200" y="100" width="200" height="250" rx="8" fill="url(#grad1)"/>
  <rect x="210" y="110" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="135" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="160" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="185" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="210" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="235" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="260" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  <rect x="210" y="285" width="180" height="15" fill="#ffffff" opacity="0.3"/>
  
  <!-- Luces indicadoras -->
  <circle cx="240" cy="125" r="4" fill="#34d399"/>
  <circle cx="240" cy="150" r="4" fill="#34d399"/>
  <circle cx="240" cy="175" r="4" fill="#34d399"/>
  
  <!-- Cables/conexiones -->
  <path d="M 150 200 Q 180 150 200 140" stroke="#10b981" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 450 200 Q 420 150 400 140" stroke="#0369a1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 300 350 L 300 400" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Base/Pie -->
  <rect x="180" y="360" width="240" height="80" rx="8" fill="#e2e8f0" opacity="0.5"/>
  <rect x="190" y="370" width="220" height="10" rx="2" fill="#10b981" opacity="0.7"/>
  <rect x="190" y="390" width="220" height="10" rx="2" fill="#0369a1" opacity="0.7"/>
  
  <!-- Iconos de conectividad -->
  <circle cx="100" cy="400" r="30" fill="#10b981" opacity="0.3"/>
  <text x="100" y="410" font-size="24" text-anchor="middle" fill="#10b981">⚡</text>
  
  <circle cx="500" cy="400" r="30" fill="#0369a1" opacity="0.3"/>
  <text x="500" y="410" font-size="24" text-anchor="middle" fill="#0369a1">🔒</text>
</svg>