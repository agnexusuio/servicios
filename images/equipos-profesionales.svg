<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad)"/>
  <!-- Estantes de equipos -->
  <rect x="40" y="50" width="80" height="120" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="150" y="50" width="80" height="120" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="260" y="50" width="80" height="120" rx="4" fill="#ffffff" opacity="0.2"/>
  <!-- Equipos -->
  <rect x="50" y="60" width="60" height="15" rx="2" fill="#34d399" opacity="0.8"/>
  <rect x="50" y="85" width="60" height="15" rx="2" fill="#34d399" opacity="0.7"/>
  <rect x="50" y="110" width="60" height="15" rx="2" fill="#34d399" opacity="0.6"/>
  <rect x="50" y="135" width="60" height="15" rx="2" fill="#34d399" opacity="0.5"/>
  <!-- Equipos en segundo estante -->
  <rect x="160" y="70" width="60" height="20" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="160" y="100" width="60" height="20" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="160" y="130" width="60" height="20" rx="2" fill="#ffffff" opacity="0.4"/>
  <!-- Equipos en tercer estante -->
  <rect x="270" y="65" width="60" height="18" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="270" y="95" width="60" height="18" rx="2" fill="#ffffff" opacity="0.4"/>
  <rect x="270" y="125" width="60" height="18" rx="2" fill="#ffffff" opacity="0.4"/>
  <!-- Indicadores LED -->
  <circle cx="105" cy="67" r="3" fill="#34d399"/>
  <circle cx="105" cy="92" r="3" fill="#34d399"/>
  <!-- Iconos -->
  <text x="300" y="180" font-size="20" text-anchor="middle" fill="#ffffff">🛒</text>
</svg>