<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#075985;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="150" fill="url(#grad)"/>
  <!-- Monitor/Dashboard de monitoreo -->
  <rect x="50" y="30" width="120" height="80" rx="4" fill="#ffffff" opacity="0.2" stroke="#ffffff" stroke-width="2"/>
  <!-- Pantalla -->
  <rect x="55" y="35" width="110" height="65" rx="2" fill="#ffffff" opacity="0.1"/>
  <!-- Gráficas/Líneas -->
  <polyline points="65,80 75,70 85,75 95,65 105,72 110,60" stroke="#34d399" stroke-width="2" fill="none" opacity="0.7"/>
  <polyline points="65,85 75,78 85,82 95,75 105,80 110,70" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Base del monitor -->
  <rect x="80" y="100" width="40" height="8" rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="85" y="108" width="30" height="4" fill="#ffffff" opacity="0.2"/>
  <!-- Indicadores de estado -->
  <circle cx="200" cy="50" r="8" fill="#34d399" opacity="0.8"/>
  <circle cx="200" cy="75" r="8" fill="#34d399" opacity="0.6"/>
  <circle cx="200" cy="100" r="8" fill="#34d399" opacity="0.4"/>
  <!-- Iconos -->
  <text x="240" y="80" font-size="28" text-anchor="middle" fill="#ffffff">📊</text>
  <text x="30" y="80" font-size="28" text-anchor="middle" fill="#ffffff">🛡️</text>
</svg>