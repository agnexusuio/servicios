<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad)"/>
  <!-- Teléfono/Dispositivo central -->
  <rect x="160" y="40" width="80" height="120" rx="8" fill="#ffffff" opacity="0.2"/>
  <rect x="165" y="45" width="70" height="100" rx="6" fill="#ffffff" opacity="0.3"/>
  <!-- Pantalla -->
  <rect x="170" y="50" width="60" height="80" rx="4" fill="#ffffff" opacity="0.5"/>
  <!-- Líneas de comunicación -->
  <path d="M 100 100 Q 140 80 160 70" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M 300 100 Q 260 80 240 70" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M 120 140 Q 160 160 180 170" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M 280 140 Q 240 160 220 170" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <!-- Iconos -->
  <text x="80" y="110" font-size="28" text-anchor="middle" fill="#ffffff">📞</text>
  <text x="320" y="110" font-size="28" text-anchor="middle" fill="#ffffff">💬</text>
  <text x="120" y="175" font-size="24" text-anchor="middle" fill="#ffffff">🎤</text>
  <text x="280" y="175" font-size="24" text-anchor="middle" fill="#ffffff">🔊</text>
</svg>