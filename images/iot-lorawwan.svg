<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad)"/>
  <!-- Sensor central -->
  <circle cx="200" cy="100" r="35" fill="#ffffff" opacity="0.3"/>
  <circle cx="200" cy="100" r="25" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="100" r="15" fill="#34d399"/>
  <!-- Sensores remotos -->
  <circle cx="80" cy="60" r="15" fill="#ffffff" opacity="0.4"/>
  <circle cx="320" cy="60" r="15" fill="#ffffff" opacity="0.4"/>
  <circle cx="100" cy="140" r="15" fill="#ffffff" opacity="0.4"/>
  <circle cx="300" cy="140" r="15" fill="#ffffff" opacity="0.4"/>
  <!-- Líneas de transmisión LoRaWAN -->
  <path d="M 200 100 L 80 60" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <path d="M 200 100 L 320 60" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <path d="M 200 100 L 100 140" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <path d="M 200 100 L 300 140" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <!-- Animación de señales (estática) -->
  <circle cx="80" cy="60" r="20" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <circle cx="320" cy="60" r="20" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <!-- Iconos -->
  <text x="200" y="108" font-size="24" text-anchor="middle" fill="#ffffff">📡</text>
  <text x="80" y="68" font-size="16" text-anchor="middle" fill="#ffffff">🌡️</text>
  <text x="320" y="68" font-size="16" text-anchor="middle" fill="#ffffff">💧</text>
  <text x="100" y="148" font-size="16" text-anchor="middle" fill="#ffffff">🔋</text>
  <text x="300" y="148" font-size="16" text-anchor="middle" fill="#ffffff">⚡</text>
</svg>