<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="150" fill="url(#grad)"/>
  <!-- Herramientas de instalación -->
  <g transform="translate(60,30)">
    <!-- Destornillador -->
    <rect x="0" y="10" width="8" height="40" fill="#ffffff" opacity="0.5"/>
    <rect x="2" y="0" width="4" height="10" fill="#34d399"/>
    <!-- Llave inglesa -->
    <circle cx="50" cy="30" r="12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <line x1="60" y1="30" x2="75" y2="30" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Servidor siendo instalado -->
  <rect x="70" y="60" width="60" height="50" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="75" y="65" width="50" height="8" rx="2" fill="#34d399" opacity="0.7"/>
  <rect x="75" y="80" width="50" height="8" rx="2" fill="#34d399" opacity="0.7"/>
  <!-- Conectores -->
  <circle cx="130" cy="75" r="4" fill="#34d399"/>
  <circle cx="130" cy="88" r="4" fill="#34d399"/>
  <!-- Iconos de instalación -->
  <text x="150" y="100" font-size="24" text-anchor="middle" fill="#ffffff">⚙️</text>
  <text x="180" y="75" font-size="28" text-anchor="middle" fill="#ffffff">✓</text>
</svg>