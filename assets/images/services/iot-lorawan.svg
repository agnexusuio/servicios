<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitoreo IoT y LoRaWAN</title>
  <desc id="desc">Ilustracion explicita de sensores de temperatura, gateway LoRaWAN y dashboard de monitoreo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e2b"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g fill="#ccfbf1">
    <rect x="220" y="250" width="230" height="120" rx="16"/>
    <rect x="220" y="520" width="230" height="120" rx="16"/>
    <rect x="680" y="340" width="240" height="130" rx="16"/>
    <rect x="1100" y="230" width="300" height="430" rx="18"/>
  </g>

  <g fill="#064e3b" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <text x="335" y="320">SENSOR TEMP</text>
    <text x="335" y="590">SENSOR HUMEDAD</text>
    <text x="800" y="415">GATEWAY LORAWAN</text>
    <text x="1250" y="300">DASHBOARD</text>
    <text x="1250" y="360">ALERTAS</text>
    <text x="1250" y="420">HISTORICO</text>
  </g>

  <g stroke="url(#acc)" stroke-width="8" fill="none" stroke-linecap="round">
    <line x1="450" y1="310" x2="680" y2="380"/>
    <line x1="450" y1="580" x2="680" y2="430"/>
    <line x1="920" y1="405" x2="1100" y2="405"/>
    <path d="M760 300 A70 70 0 0 1 840 300"/>
    <path d="M740 275 A95 95 0 0 1 860 275"/>
  </g>

  <text x="800" y="810" text-anchor="middle" fill="#ecfeff" font-size="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Monitoreo IoT / LoRaWAN</text>
</svg>
