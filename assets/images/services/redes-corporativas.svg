<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Redes empresariales</title>
  <desc id="desc">Ilustracion corporativa premium de infraestructura de red y conectividad.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#182537"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="spot1" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5edf5"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#spot1)"/>

  <g opacity="0.2" stroke="#94a3b8" fill="none">
    <path d="M0 730 C 300 660, 650 760, 1040 700 C 1250 670, 1460 690, 1600 740"/>
    <circle cx="220" cy="220" r="120"/>
    <circle cx="1420" cy="640" r="150"/>
  </g>

  <g transform="translate(270 190)">
    <rect x="0" y="0" width="1060" height="520" rx="26" fill="#111c2d" opacity="0.8"/>
    <rect x="28" y="28" width="1004" height="464" rx="22" fill="url(#card1)"/>
    <rect x="70" y="90" width="920" height="54" rx="12" fill="#9aaabd"/>
    <rect x="70" y="170" width="500" height="24" rx="8" fill="#73879c"/>
    <rect x="70" y="210" width="640" height="24" rx="8" fill="#73879c"/>
    <rect x="70" y="250" width="740" height="24" rx="8" fill="#73879c"/>

    <g stroke="url(#green1)" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow1)">
      <path d="M120 380 L300 330 L480 390 L650 295 L820 360"/>
      <path d="M160 430 L340 370 L510 430 L700 340 L900 400" opacity="0.8"/>
    </g>

    <g fill="#10b981">
      <circle cx="120" cy="380" r="11"/>
      <circle cx="300" cy="330" r="11"/>
      <circle cx="480" cy="390" r="11"/>
      <circle cx="650" cy="295" r="11"/>
      <circle cx="820" cy="360" r="11"/>
      <circle cx="900" cy="400" r="11"/>
    </g>
  </g>

  <text x="800" y="805" text-anchor="middle" fill="#e2e8f0" font-size="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Redes Empresariales</text>
</svg>
