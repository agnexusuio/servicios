<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Redes empresariales</title>
  <desc id="desc">Diagrama explicito de red empresarial con firewall, switch core, servidores y estaciones de trabajo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g fill="#e2e8f0" opacity="0.95">
    <rect x="620" y="350" width="360" height="120" rx="18"/>
    <rect x="220" y="220" width="240" height="90" rx="14"/>
    <rect x="220" y="580" width="240" height="90" rx="14"/>
    <rect x="1140" y="220" width="240" height="90" rx="14"/>
    <rect x="1140" y="580" width="240" height="90" rx="14"/>
    <rect x="700" y="150" width="200" height="90" rx="14"/>
  </g>

  <g fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="28" text-anchor="middle">
    <text x="800" y="420">SWITCH CORE</text>
    <text x="340" y="275">VLAN VENTAS</text>
    <text x="340" y="635">VLAN OPERACIONES</text>
    <text x="1260" y="275">SERVIDOR ERP</text>
    <text x="1260" y="635">SERVIDOR CCTV</text>
    <text x="800" y="205">FIREWALL UTM</text>
  </g>

  <g stroke="url(#acc)" stroke-width="8" fill="none" stroke-linecap="round">
    <line x1="800" y1="240" x2="800" y2="350"/>
    <line x1="620" y1="410" x2="460" y2="265"/>
    <line x1="620" y1="410" x2="460" y2="625"/>
    <line x1="980" y1="410" x2="1140" y2="265"/>
    <line x1="980" y1="410" x2="1140" y2="625"/>
  </g>

  <g fill="#10b981">
    <circle cx="800" cy="350" r="9"/>
    <circle cx="620" cy="410" r="9"/>
    <circle cx="980" cy="410" r="9"/>
  </g>

  <text x="800" y="810" text-anchor="middle" fill="#e2e8f0" font-size="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Redes Empresariales</text>
</svg>
