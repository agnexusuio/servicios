<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Telefonia IP empresarial</title>
  <desc id="desc">Ilustracion explicita de central PBX IP, extensiones SIP, cola de llamadas e IVR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g fill="#e5e7eb">
    <rect x="640" y="290" width="320" height="180" rx="18"/>
    <rect x="220" y="250" width="260" height="90" rx="14"/>
    <rect x="220" y="560" width="260" height="90" rx="14"/>
    <rect x="1120" y="250" width="260" height="90" rx="14"/>
    <rect x="1120" y="560" width="260" height="90" rx="14"/>
    <rect x="690" y="160" width="220" height="80" rx="14"/>
  </g>

  <g fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="28" text-anchor="middle">
    <text x="800" y="390">PBX IP</text>
    <text x="350" y="305">EXT 101</text>
    <text x="350" y="615">EXT 102</text>
    <text x="1250" y="305">SOFTPHONE</text>
    <text x="1250" y="615">TRONCAL SIP</text>
    <text x="800" y="212">IVR / COLA</text>
  </g>

  <g stroke="url(#acc)" stroke-width="8" fill="none" stroke-linecap="round">
    <line x1="800" y1="240" x2="800" y2="290"/>
    <line x1="640" y1="380" x2="480" y2="295"/>
    <line x1="640" y1="380" x2="480" y2="605"/>
    <line x1="960" y1="380" x2="1120" y2="295"/>
    <line x1="960" y1="380" x2="1120" y2="605"/>
  </g>

  <text x="800" y="810" text-anchor="middle" fill="#e5e7eb" font-size="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Telefonia IP / PBX</text>
</svg>
