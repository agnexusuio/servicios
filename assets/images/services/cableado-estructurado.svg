<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cableado estructurado</title>
  <desc id="desc">Ilustracion explicita de rack, patch panel, switch y tendido de cable categoria 6.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <g fill="#dbeafe">
    <rect x="250" y="170" width="380" height="560" rx="20"/>
    <rect x="970" y="170" width="380" height="560" rx="20"/>
    <rect x="690" y="280" width="220" height="180" rx="16"/>
    <rect x="690" y="500" width="220" height="180" rx="16"/>
  </g>

  <g fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <text x="440" y="225">PATCH PANEL</text>
    <text x="1160" y="225">SWITCH 48P</text>
    <text x="800" y="380">RACK PISO</text>
    <text x="800" y="600">PUNTOS CAT6</text>
  </g>

  <g stroke="url(#acc)" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M630 300 C 660 300, 660 300, 690 340"/>
    <path d="M910 340 C 940 300, 940 300, 970 300"/>
    <path d="M630 580 C 700 650, 900 650, 970 580"/>
    <path d="M630 540 C 700 610, 900 610, 970 540"/>
  </g>

  <text x="800" y="810" text-anchor="middle" fill="#e2e8f0" font-size="56" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Cableado Estructurado</text>
</svg>
